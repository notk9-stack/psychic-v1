<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFTEKHAR DASHBOARD - বট কন্ট্রোল প্যানেল</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .sidebar {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            box-shadow: 2px 0 20px rgba(0,0,0,0.3);
            z-index: 100;
        }
        
        .sidebar-header { padding: 25px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h3 { background: linear-gradient(135deg, #00d4ff, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 25px;
            margin: 5px 0;
            transition: all 0.3s;
        }
        
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: white;
        }
        
        .sidebar .nav-link i { margin-right: 12px; width: 20px; }
        
        .main-content { margin-left: 260px; padding: 20px; }
        
        .top-bar {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
            transition: transform 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-card:hover { transform: translateY(-3px); border-color: #00d4ff; }
        .stat-icon { font-size: 2rem; margin-bottom: 10px; color: #00d4ff; }
        .stat-value { font-size: 2rem; font-weight: bold; }
        
        .bot-card {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        
        .bot-card:hover { transform: translateX(5px); border-color: #00d4ff; }
        
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-running { background: rgba(40,167,69,0.2); color: #28a745; border: 1px solid #28a745; }
        .status-stopped { background: rgba(220,53,69,0.2); color: #dc3545; border: 1px solid #dc3545; }
        
        .btn-icon { padding: 8px 15px; margin: 3px; border-radius: 10px; font-size: 13px; }
        
        .log-viewer {
            background: #0a0a0f;
            color: #00d4ff;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .log-entry { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 5px; margin: 2px 0; }
        .log-time { color: #7c3aed; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; min-height: auto; }
            .main-content { margin-left: 0; }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-robot"></i> IFTEKHAR</h3>
            <p>বট হোস্টিং প্যানেল</p>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/"><i class="fas fa-home"></i> হোম</a>
            <a class="nav-link active" href="/dashboard"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</a>
            <a class="nav-link" href="/bot_manager"><i class="fas fa-server"></i> বট ম্যানেজার</a>
        </nav>
        
        <div class="p-3 mt-auto" style="position: absolute; bottom: 0; width: 100%;">
            <hr class="bg-light">
            <small>সিস্টেম স্ট্যাটাস</small>
            <div class="mt-2">
                <div class="d-flex justify-content-between"><small>CPU</small><small id="cpuPercent">0%</small></div>
                <div class="progress mt-1" style="height: 5px;"><div id="cpuProgress" class="progress-bar bg-info" style="width: 0%"></div></div>
            </div>
            <div class="mt-2">
                <div class="d-flex justify-content-between"><small>RAM</small><small id="ramPercent">0%</small></div>
                <div class="progress mt-1" style="height: 5px;"><div id="ramProgress" class="progress-bar bg-success" style="width: 0%"></div></div>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="top-bar">
            <h4 class="text-white mb-0"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</h4>
            <div><span class="text-white me-3"><i class="fas fa-user"></i> IFTEKHAR</span>
            <button class="btn btn-sm btn-outline-info" onclick="refreshDashboard()"><i class="fas fa-sync-alt"></i> রিফ্রেশ</button></div>
        </div>
        
        <div class="row">
            <div class="col-md-3"><div class="stat-card text-center"><div class="stat-icon"><i class="fas fa-robot"></i></div><div class="stat-value" id="totalBots">0</div><small>মোট বট</small></div></div>
            <div class="col-md-3"><div class="stat-card text-center"><div class="stat-icon"><i class="fas fa-play-circle"></i></div><div class="stat-value" id="runningBots">0</div><small>চালু আছে</small></div></div>
            <div class="col-md-3"><div class="stat-card text-center"><div class="stat-icon"><i class="fas fa-stop-circle"></i></div><div class="stat-value" id="stoppedBots">0</div><small>বন্ধ আছে</small></div></div>
            <div class="col-md-3"><div class="stat-card text-center"><div class="stat-icon"><i class="fas fa-microchip"></i></div><div class="stat-value" id="cpuDisplay">0%</div><small>CPU ব্যবহার</small></div></div>
        </div>
        
        <div class="stat-card"><h5><i class="fas fa-list"></i> আপনার বট সমূহ</h5><div id="botsList"><div class="text-center py-5"><div class="spinner-border text-info"></div><p class="mt-2">লোড হচ্ছে...</p></div></div></div>
    </div>
    
    <div class="modal fade" id="logModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content" style="background: #1a1a2e; color: white;"><div class="modal-header border-secondary"><h5 class="modal-title"><i class="fas fa-terminal text-info"></i> বট লগ</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="logContent" class="log-viewer"><div class="text-center">লোড হচ্ছে...</div></div></div></div></div></div>
    
    <script>
        let autoRefresh = true;
        let refreshInterval;
        
        async function loadDashboard() {
            try {
                const sysRes = await fetch('/api/system');
                const sysData = await sysRes.json();
                
                document.getElementById('totalBots').innerText = sysData.bots_count || 0;
                document.getElementById('runningBots').innerText = sysData.running_bots || 0;
                document.getElementById('stoppedBots').innerText = (sysData.bots_count - sysData.running_bots) || 0;
                document.getElementById('cpuDisplay').innerText = sysData.cpu_percent + '%';
                document.getElementById('cpuPercent').innerText = sysData.cpu_percent + '%';
                document.getElementById('cpuProgress').style.width = sysData.cpu_percent + '%';
                document.getElementById('ramPercent').innerText = sysData.memory_percent + '%';
                document.getElementById('ramProgress').style.width = sysData.memory_percent + '%';
                
                const botsRes = await fetch('/api/bots');
                const bots = await botsRes.json();
                
                if (bots.length === 0) {
                    document.getElementById('botsList').innerHTML = `<div class="text-center py-5"><i class="fas fa-inbox fa-3x text-muted"></i><p class="mt-2">কোনো বট আপলোড করা নেই</p><a href="/bot_manager" class="btn btn-info"><i class="fas fa-upload"></i> বট আপলোড করুন</a></div>`;
                    return;
                }
                
                let html = '<div class="row">';
                bots.forEach(bot => {
                    const statusClass = bot.status === 'running' ? 'status-running' : 'status-stopped';
                    const statusText = bot.status === 'running' ? '● চলছে' : '○ বন্ধ';
                    html += `<div class="col-md-6"><div class="bot-card"><div class="d-flex justify-content-between align-items-start"><div><h6 class="mb-1"><i class="fas ${bot.status === 'running' ? 'fa-play-circle' : 'fa-stop-circle'} me-2" style="color: ${bot.status === 'running' ? '#28a745' : '#dc3545'}"></i>${bot.name}</h6><small class="text-muted">ID: ${bot.id.substring(0, 15)}...</small><br><small class="text-muted"><i class="far fa-calendar-alt"></i> ${new Date(bot.created_at).toLocaleString()}</small></div><div class="text-end"><span class="status-badge ${statusClass}">${statusText}</span></div></div><div class="mt-3">${bot.status === 'running' ? `<button class="btn btn-warning btn-icon" onclick="stopBot('${bot.id}')"><i class="fas fa-stop"></i> বন্ধ</button><button class="btn btn-info btn-icon" onclick="restartBot('${bot.id}')"><i class="fas fa-sync-alt"></i> রিস্টার্ট</button>` : `<button class="btn btn-success btn-icon" onclick="startBot('${bot.id}')"><i class="fas fa-play"></i> চালু</button>`}<button class="btn btn-secondary btn-icon" onclick="viewLogs('${bot.id}')"><i class="fas fa-terminal"></i> লগ</button><button class="btn btn-danger btn-icon" onclick="deleteBot('${bot.id}')"><i class="fas fa-trash"></i> ডিলিট</button></div></div></div>`;
                });
                html += '</div>';
                document.getElementById('botsList').innerHTML = html;
            } catch(e) { console.error('Error loading dashboard:', e); }
        }
        
        async function startBot(botId) { const response = await fetch(`/api/bots/${botId}/start`, { method: 'POST' }); const data = await response.json(); if(data.success){ showToast('✅ বট চালু করা হয়েছে', 'success'); loadDashboard(); } else { showToast('❌ ' + data.error, 'error'); } }
        async function stopBot(botId) { const response = await fetch(`/api/bots/${botId}/stop`, { method: 'POST' }); const data = await response.json(); if(data.success){ showToast('⏹️ বট বন্ধ করা হয়েছে', 'success'); loadDashboard(); } else { showToast('❌ বট বন্ধ করতে ব্যর্থ হয়েছে', 'error'); } }
        async function restartBot(botId) { const response = await fetch(`/api/bots/${botId}/restart`, { method: 'POST' }); const data = await response.json(); if(data.success){ showToast('🔄 বট রিস্টার্ট করা হয়েছে', 'success'); loadDashboard(); } else { showToast('❌ ' + data.error, 'error'); } }
        async function deleteBot(botId) { if(confirm('⚠️ আপনি কি এই বট ডিলিট করতে চান?')){ const response = await fetch(`/api/bots/${botId}`, { method: 'DELETE' }); const data = await response.json(); if(data.success){ showToast('🗑️ বট ডিলিট করা হয়েছে', 'success'); loadDashboard(); } else { showToast('❌ ডিলিট করতে ব্যর্থ হয়েছে', 'error'); } } }
        async function viewLogs(botId) { const response = await fetch(`/api/bots/${botId}/logs`); const logs = await response.json(); let logHtml = ''; if(logs.length === 0){ logHtml = '<div class="text-center py-5"><i class="fas fa-inbox fa-2x"></i><p>কোনো লগ নেই</p></div>'; } else { logs.forEach(log => { logHtml += `<div class="log-entry"><span class="log-time">[${new Date(log.time).toLocaleTimeString()}]</span> <span>${escapeHtml(log.message)}</span></div>`; }); } document.getElementById('logContent').innerHTML = logHtml; new bootstrap.Modal(document.getElementById('logModal')).show(); }
        function refreshDashboard() { loadDashboard(); showToast('🔄 ড্যাশবোর্ড রিফ্রেশ করা হয়েছে', 'success'); }
        function showToast(message, type) { const toast = document.createElement('div'); toast.className = `position-fixed bottom-0 end-0 m-3 alert alert-${type === 'success' ? 'success' : 'danger'} shadow-lg`; toast.style.zIndex = '9999'; toast.style.background = type === 'success' ? '#28a745' : '#dc3545'; toast.style.color = 'white'; toast.style.borderRadius = '10px'; toast.style.padding = '12px 20px'; toast.innerHTML = message; document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000); }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function startAutoRefresh() { if(refreshInterval) clearInterval(refreshInterval); refreshInterval = setInterval(() => { if(autoRefresh) loadDashboard(); }, 10000); }
        startAutoRefresh(); loadDashboard();
    </script>
</body>
</html>
