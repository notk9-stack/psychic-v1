<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFTEKHAR BOT HOSTING - টেলিগ্রাম বট হোস্টিং প্ল্যাটফর্ম</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .navbar {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #00d4ff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientBG 3s ease infinite;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: white;
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.5);
        }
        
        .card-header {
            background: rgba(0, 212, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 0 0 !important;
            font-weight: bold;
            padding: 15px 20px;
        }
        
        .card-header i {
            margin-right: 10px;
            color: #00d4ff;
        }
        
        /* স্ট্যাটাস ইন্ডিকেটর */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .status-running {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.3);
        }
        
        .status-stopped {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }
        
        .status-starting {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffc107;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .dot-running { background: #28a745; box-shadow: 0 0 8px #28a745; }
        .dot-stopped { background: #dc3545; }
        .dot-starting { background: #ffc107; }
        
        /* আপলোড এরিয়া */
        .upload-area {
            border: 2px dashed #00d4ff;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 212, 255, 0.05);
        }
        
        .upload-area:hover, .upload-area.dragover {
            background: rgba(0, 212, 255, 0.15);
            border-color: #ff6b6b;
            transform: scale(1.02);
        }
        
        /* বাটন */
        .btn-gradient {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-gradient:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
            color: white;
        }
        
        .btn-outline-gradient {
            background: transparent;
            border: 2px solid #00d4ff;
            color: #00d4ff;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-outline-gradient:hover {
            background: #00d4ff;
            color: #1a1a2e;
            transform: scale(1.05);
        }
        
        .btn-danger-gradient {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        /* কনসোল লগ */
        .console-log {
            background: #0a0a0f;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            height: 300px;
            overflow-y: auto;
        }
        
        .log-entry {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: monospace;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .log-time {
            color: #00d4ff;
            margin-right: 15px;
            font-weight: bold;
        }
        
        .log-output { color: #a0a0a0; }
        .log-error { color: #ff6b6b; }
        .log-success { color: #51cf66; }
        .log-warning { color: #ffd93d; }
        
        /* ফাইল লিস্ট */
        .file-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .file-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .file-item:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateX(5px);
        }
        
        .file-item.active {
            background: rgba(0, 212, 255, 0.3);
            border-left: 3px solid #00d4ff;
        }
        
        /* কোড এডিটর */
        .code-editor {
            background: #0a0a0f;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            width: 100%;
            min-height: 400px;
            color: #00d4ff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            resize: vertical;
        }
        
        .code-editor:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        
        /* প্রগ্রেস বার */
        .progress {
            height: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-radius: 10px;
            transition: width 0.5s;
        }
        
        /* টোস্ট নোটিফিকেশন */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* রেসপন্সিভ */
        @media (max-width: 768px) {
            .navbar-brand { font-size: 1.2rem; }
            .btn-gradient, .btn-outline-gradient { padding: 6px 15px; font-size: 12px; }
            .card-header { font-size: 14px; }
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-server"></i> IFTEKHAR BOT HOSTING
            </a>
            <div class="ms-auto">
                <span id="statusBadge" class="status-indicator status-stopped">
                    <span class="status-dot dot-stopped"></span> 
                    <span id="serverStatusText">বন্ধ</span>
                </span>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <!-- সিস্টেম মনিটরিং কার্ড -->
        <div class="row">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-microchip fa-2x" style="color: #00d4ff;"></i>
                        <h3 class="mt-2" id="cpuValue">0%</h3>
                        <small>CPU ব্যবহার</small>
                        <div class="progress mt-2"><div id="cpuBar" class="progress-bar" style="width: 0%"></div></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-memory fa-2x" style="color: #ff6b6b;"></i>
                        <h3 class="mt-2" id="ramValue">0%</h3>
                        <small>RAM ব্যবহার</small>
                        <div class="progress mt-2"><div id="ramBar" class="progress-bar" style="width: 0%"></div></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-robot fa-2x" style="color: #ffd93d;"></i>
                        <h3 class="mt-2" id="botNameDisplay">—</h3>
                        <small>বর্তমান বট</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-clock fa-2x" style="color: #51cf66;"></i>
                        <h3 class="mt-2" id="uptimeValue">0h</h3>
                        <small>রান টাইম</small>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- কন্ট্রোল বাটন -->
        <div class="card">
            <div class="card-body text-center">
                <div class="row g-2">
                    <div class="col-md-8 mx-auto">
                        <button class="btn btn-gradient" onclick="startBot()">
                            <i class="fas fa-play"></i> স্টার্ট
                        </button>
                        <button class="btn btn-outline-gradient ms-2" onclick="stopBot()">
                            <i class="fas fa-stop"></i> স্টপ
                        </button>
                        <button class="btn btn-outline-gradient ms-2" onclick="restartBot()">
                            <i class="fas fa-sync-alt"></i> রিস্টার্ট
                        </button>
                        <button class="btn btn-danger-gradient ms-2" onclick="deleteBot()">
                            <i class="fas fa-trash"></i> ডিলিট
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- আপলোড এবং ফাইল ম্যানেজার -->
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><i class="fas fa-cloud-upload-alt"></i> বট আপলোড</div>
                    <div class="card-body">
                        <div id="uploadArea" class="upload-area" onclick="document.getElementById('fileInput').click()">
                            <i class="fas fa-file-archive fa-3x" style="color: #00d4ff;"></i>
                            <h6 class="mt-2">জিপ ফাইল আপলোড করুন</h6>
                            <small class="text-muted">ক্লিক করুন অথবা ড্র্যাগ করুন</small>
                            <input type="file" id="fileInput" accept=".zip" style="display: none;">
                        </div>
                        <div id="uploadStatus" class="mt-2"></div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header"><i class="fas fa-file-alt"></i> ফাইল সমূহ</div>
                    <div class="card-body">
                        <div id="fileList" class="file-list">
                            <div class="text-center text-muted py-3">
                                <i class="fas fa-inbox fa-2x"></i>
                                <p class="mt-2">কোনো বট আপলোড করা নেই</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-code"></i> কোড এডিটর
                        <button class="btn btn-sm btn-outline-gradient float-end ms-2" onclick="saveFile()" style="padding: 5px 15px;">
                            <i class="fas fa-save"></i> সেভ
                        </button>
                        <button class="btn btn-sm btn-outline-gradient float-end" onclick="setAsMain()" style="padding: 5px 15px;">
                            <i class="fas fa-star"></i> মেইন সেট
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="editorInfo" class="small text-muted mb-2">
                            <i class="fas fa-info-circle"></i> একটি ফাইল সিলেক্ট করুন
                        </div>
                        <textarea id="codeEditor" class="code-editor" rows="20" placeholder="ফাইল সিলেক্ট করুন..."></textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- কনসোল লগ -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-terminal"></i> কনসোল লগ
                <button class="btn btn-sm btn-outline-gradient float-end" onclick="clearLogs()" style="padding: 2px 12px;">
                    <i class="fas fa-trash"></i> ক্লিয়ার
                </button>
            </div>
            <div class="card-body">
                <div id="consoleLogs" class="console-log">
                    <div class="text-center text-muted py-3">
                        <i class="fas fa-terminal fa-2x"></i>
                        <p class="mt-2">লগ দেখানোর জন্য অপেক্ষা করুন...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentFile = null;
        let isMainFile = false;
        let startTime = Date.now();
        
        // আপটাইম আপডেট
        function updateUptime() {
            let seconds = Math.floor((Date.now() - startTime) / 1000);
            let hours = Math.floor(seconds / 3600);
            let minutes = Math.floor((seconds % 3600) / 60);
            document.getElementById('uptimeValue').innerHTML = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
        }
        
        // স্ট্যাটাস লোড
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('cpuValue').innerHTML = data.cpu + '%';
                document.getElementById('cpuBar').style.width = data.cpu + '%';
                document.getElementById('ramValue').innerHTML = data.memory + '%';
                document.getElementById('ramBar').style.width = data.memory + '%';
                document.getElementById('botNameDisplay').innerHTML = data.bot_name !== 'None' ? data.bot_name : '—';
                
                const statusBadge = document.getElementById('statusBadge');
                const statusText = document.getElementById('serverStatusText');
                
                if (data.status === 'running') {
                    statusBadge.className = 'status-indicator status-running';
                    statusBadge.innerHTML = '<span class="status-dot dot-running"></span> চলছে';
                    statusText.innerHTML = 'চলছে';
                } else if (data.status === 'starting') {
                    statusBadge.className = 'status-indicator status-starting';
                    statusBadge.innerHTML = '<span class="status-dot dot-starting"></span> শুরু হচ্ছে';
                    statusText.innerHTML = 'শুরু হচ্ছে';
                } else {
                    statusBadge.className = 'status-indicator status-stopped';
                    statusBadge.innerHTML = '<span class="status-dot dot-stopped"></span> বন্ধ';
                    statusText.innerHTML = 'বন্ধ';
                }
                
                // লগ ডিসপ্লে
                if (data.logs && data.logs.length > 0) {
                    let logsHtml = '';
                    data.logs.forEach(log => {
                        let logClass = 'log-output';
                        if (log.type === 'error') logClass = 'log-error';
                        else if (log.type === 'success') logClass = 'log-success';
                        else if (log.type === 'warning') logClass = 'log-warning';
                        
                        logsHtml += `<div class="log-entry">
                            <span class="log-time">[${log.time}]</span>
                            <span class="${logClass}">${escapeHtml(log.message)}</span>
                        </div>`;
                    });
                    document.getElementById('consoleLogs').innerHTML = logsHtml;
                    const logDiv = document.getElementById('consoleLogs');
                    logDiv.scrollTop = logDiv.scrollHeight;
                }
                
                updateUptime();
            } catch(e) {
                console.error('Error:', e);
            }
        }
        
        // ফাইল লিস্ট লোড
        async function loadFiles() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                
                if (data.files && data.files.length > 0) {
                    let html = '';
                    data.files.forEach(file => {
                        const icon = file.is_py ? '<i class="fab fa-python"></i>' : '<i class="fas fa-file"></i>';
                        const isActive = currentFile === file.name ? 'active' : '';
                        const isMain = file.name === data.current_main ? '<span class="badge bg-info float-end">MAIN</span>' : '';
                        
                        html += `<div class="file-item ${isActive}" onclick="loadFile('${file.name}')">
                            ${icon} ${file.name}
                            ${isMain}
                            <small class="text-muted d-block">${(file.size/1024).toFixed(1)} KB</small>
                        </div>`;
                    });
                    document.getElementById('fileList').innerHTML = html;
                } else {
                    document.getElementById('fileList').innerHTML = '<div class="text-center text-muted py-3"><i class="fas fa-inbox fa-2x"></i><p class="mt-2">কোনো ফাইল নেই</p></div>';
                }
            } catch(e) {
                console.error('Error loading files:', e);
            }
        }
        
        // ফাইল লোড
        async function loadFile(filename) {
            try {
                const response = await fetch(`/api/file/${filename}`);
                const data = await response.json();
                
                if (data.error) {
                    showToast(data.error, 'error');
                    return;
                }
                
                document.getElementById('codeEditor').value = data.content;
                document.getElementById('editorInfo').innerHTML = `<i class="fas fa-file-code"></i> ${filename} ${data.is_main ? '<span class="badge bg-info ms-2">MAIN FILE</span>' : ''}`;
                currentFile = filename;
                isMainFile = data.is_main;
                
                // অ্যাকটিভ ক্লাস আপডেট
                document.querySelectorAll('.file-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.textContent.includes(filename)) {
                        item.classList.add('active');
                    }
                });
                
                showToast(`📄 ${filename} লোড করা হয়েছে`, 'success');
            } catch(e) {
                showToast('ফাইল লোড করতে ব্যর্থ হয়েছে', 'error');
            }
        }
        
        // ফাইল সেভ
        async function saveFile() {
            if (!currentFile) {
                showToast('প্রথমে একটি ফাইল সিলেক্ট করুন', 'warning');
                return;
            }
            
            const content = document.getElementById('codeEditor').value;
            
            try {
                const response = await fetch(`/api/file/${currentFile}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast('✅ ফাইল সেভ করা হয়েছে', 'success');
                } else {
                    showToast('❌ সেভ করতে ব্যর্থ হয়েছে', 'error');
                }
            } catch(e) {
                showToast('❌ নেটওয়ার্ক ত্রুটি', 'error');
            }
        }
        
        // মেইন ফাইল সেট
        async function setAsMain() {
            if (!currentFile) {
                showToast('প্রথমে একটি ফাইল সিলেক্ট করুন', 'warning');
                return;
            }
            
            try {
                const response = await fetch(`/api/set_main/${currentFile}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast(`🎯 ${currentFile} মেইন ফাইল হিসেবে সেট করা হয়েছে`, 'success');
                    loadFiles();
                    document.getElementById('editorInfo').innerHTML = `<i class="fas fa-file-code"></i> ${currentFile} <span class="badge bg-info ms-2">MAIN FILE</span>`;
                    isMainFile = true;
                } else {
                    showToast('❌ মেইন ফাইল সেট করতে ব্যর্থ হয়েছে', 'error');
                }
            } catch(e) {
                showToast('❌ নেটওয়ার্ক ত্রুটি', 'error');
            }
        }
        
        // জিপ আপলোড
        async function uploadBot(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            document.getElementById('uploadStatus').innerHTML = '<div class="alert alert-info mt-2"><i class="fas fa-spinner fa-spin"></i> আপলোড হচ্ছে...</div>';
            
            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('uploadStatus').innerHTML = `<div class="alert alert-success mt-2">✅ বট আপলোড সফল: ${data.bot_name}</div>`;
                    loadFiles();
                    showToast('✅ বট আপলোড সফল', 'success');
                    setTimeout(() => {
                        document.getElementById('uploadStatus').innerHTML = '';
                    }, 3000);
                } else {
                    document.getElementById('uploadStatus').innerHTML = `<div class="alert alert-danger mt-2">❌ ${data.error}</div>`;
                }
            } catch(e) {
                document.getElementById('uploadStatus').innerHTML = '<div class="alert alert-danger mt-2">❌ আপলোড ব্যর্থ</div>';
            }
        }
        
        // বট কন্ট্রোল
        async function startBot() {
            try {
                const response = await fetch('/api/start', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    showToast('🚀 বট চালু হচ্ছে...', 'success');
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            } catch(e) {
                showToast('❌ নেটওয়ার্ক ত্রুটি', 'error');
            }
        }
        
        async function stopBot() {
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    showToast('⏹️ বট বন্ধ করা হয়েছে', 'success');
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            } catch(e) {
                showToast('❌ নেটওয়ার্ক ত্রুটি', 'error');
            }
        }
        
        async function restartBot() {
            try {
                const response = await fetch('/api/restart', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    showToast('🔄 বট রিস্টার্ট হচ্ছে...', 'success');
                } else {
                    showToast('❌ ' + data.error, 'error');
                }
            } catch(e) {
                showToast('❌ নেটওয়ার্ক ত্রুটি', 'error');
            }
        }
        
        async function deleteBot() {
            if (confirm('⚠️ আপনি কি বট ডিলিট করতে চান? সব ফাইল মুছে যাবে!')) {
                try {
                    const response = await fetch('/api/delete', { method: 'POST' });
                    const data = await response.json();
                    if (data.success) {
                        showToast('🗑️ বট ডিলিট করা হয়েছে', 'success');
                        currentFile = null;
                        document.getElementById('codeEditor').value = '';
                        document.getElementById('editorInfo').innerHTML = '<i class="fas fa-info-circle"></i> একটি ফাইল সিলেক্ট করুন';
                        loadFiles();
                    } else {
                        showToast('❌ ডিলিট করতে ব্যর্থ হয়েছে', 'error');
                    }
                } catch(e) {
                    showToast('❌ নেটওয়ার্ক ত্রুটি', 'error');
                }
            }
        }
        
        function clearLogs() {
            document.getElementById('consoleLogs').innerHTML = '<div class="text-center text-muted py-3"><i class="fas fa-terminal fa-2x"></i><p class="mt-2">লগ ক্লিয়ার করা হয়েছে</p></div>';
            showToast('📋 লগ ক্লিয়ার করা হয়েছে', 'info');
        }
        
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast-notification alert alert-${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'info'} shadow-lg`;
            toast.style.background = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#17a2b8';
            toast.style.color = 'white';
            toast.style.borderRadius = '10px';
            toast.style.padding = '12px 20px';
            toast.style.minWidth = '250px';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // আপলোড এরিয়া ইভেন্ট
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.endsWith('.zip')) {
                uploadBot(files[0]);
            } else {
                showToast('শুধু .zip ফাইল আপলোড করুন', 'error');
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadBot(e.target.files[0]);
            }
        });
        
        // অটো রিফ্রেশ
        setInterval(loadStatus, 2000);
        loadStatus();
        startTime = Date.now();
    </script>
</body>
</html>
