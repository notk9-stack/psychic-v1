<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iftekhar Hosting - Server Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); color: #e0e0e0; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .container { max-width: 1600px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }
        .header { text-align: center; margin-bottom: 30px; }
        .title { font-size: 52px; font-weight: 800; }
        .title .red { background: linear-gradient(135deg, #ff4444, #ff6666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .title .blue { background: linear-gradient(135deg, #4488ff, #6666ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 8px; }
        .dashboard { display: grid; grid-template-columns: 1fr 420px; gap: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: rgba(30,41,59,0.7); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.08); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-value { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top: 8px; }
        .server-controls { display: flex; gap: 16px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
        .ctrl-btn { padding: 12px 32px; border: none; border-radius: 60px; font-size: 16px; font-weight: 700; color: white; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; }
        .ctrl-btn::before { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%,-50%); transition: width 0.5s, height 0.5s; }
        .ctrl-btn:hover::before { width: 200px; height: 200px; }
        .ctrl-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .ctrl-btn:active { transform: translateY(2px); }
        .ctrl-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-start { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-stop { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .btn-restart { background: linear-gradient(135deg, #0d9488, #14b8a6); }
        .status-card { background: rgba(30,41,59,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 12px 20px; text-align: center; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.08); }
        .status-running { color: #4ade80; }
        .status-stopped { color: #f87171; }
        .dropzone { background: rgba(30,41,59,0.5); border: 2px dashed rgba(102,126,234,0.4); border-radius: 24px; padding: 35px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 24px; }
        .dropzone:hover { border-color: #667eea; background: rgba(102,126,234,0.1); transform: scale(1.01); }
        .dropzone.drag-over { border-color: #4ade80; background: rgba(74,222,128,0.1); }
        .dropzone i { font-size: 48px; color: #667eea; margin-bottom: 15px; }
        .progress-bar { height: 4px; background: rgba(102,126,234,0.2); border-radius: 4px; overflow: hidden; margin-bottom: 24px; display: none; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s; }
        .files-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .refresh-btn { background: rgba(255,255,255,0.08); border: none; padding: 6px 16px; border-radius: 30px; color: white; cursor: pointer; font-size: 13px; }
        .refresh-btn:hover { background: rgba(102,126,234,0.3); }
        .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-height: 480px; overflow-y: auto; padding-right: 6px; }
        .files-grid::-webkit-scrollbar { width: 5px; }
        .files-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .files-grid::-webkit-scrollbar-thumb { background: #667eea; border-radius: 3px; }
        .file-card { background: rgba(30,41,59,0.6); backdrop-filter: blur(10px); border-radius: 18px; padding: 16px; border: 1px solid rgba(255,255,255,0.06); transition: all 0.3s; position: relative; animation: fadeInUp 0.4s ease forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .file-card:hover { transform: translateY(-5px); border-color: rgba(102,126,234,0.4); }
        .main-badge { position: absolute; top: 12px; right: 12px; background: linear-gradient(135deg, #FFD700, #FFA500); padding: 3px 10px; border-radius: 20px; font-size: 9px; font-weight: bold; color: #1a1a2e; }
        .file-icon { font-size: 36px; margin-bottom: 10px; }
        .file-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; word-break: break-word; }
        .file-meta { font-size: 10px; color: #94a3b8; margin-bottom: 12px; }
        .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .action-btn { background: rgba(255,255,255,0.06); border: none; padding: 5px 12px; border-radius: 30px; cursor: pointer; color: #e0e0e0; font-size: 11px; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
        .action-btn:hover { background: rgba(102,126,234,0.4); transform: scale(1.05); }
        .right-panel { background: rgba(10,15,25,0.9); backdrop-filter: blur(10px); border-radius: 24px; border: 1px solid rgba(102,126,234,0.2); height: fit-content; position: sticky; top: 20px; }
        .console-header { padding: 16px 20px; border-bottom: 1px solid rgba(102,126,234,0.2); display: flex; justify-content: space-between; align-items: center; }
        .console-title { font-weight: 700; color: #667eea; }
        .console-actions { display: flex; gap: 10px; }
        .console-btn { background: rgba(255,255,255,0.05); border: none; padding: 5px 12px; border-radius: 8px; color: #94a3b8; cursor: pointer; font-size: 11px; transition: all 0.2s; }
        .console-btn:hover { background: rgba(102,126,234,0.2); color: white; }
        .console-output { height: 550px; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 12px; }
        .console-output::-webkit-scrollbar { width: 4px; }
        .console-output::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .console-output::-webkit-scrollbar-thumb { background: #667eea; border-radius: 3px; }
        .log-line { padding: 6px 8px; margin-bottom: 4px; border-radius: 8px; border-left: 3px solid; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .log-output { border-left-color: #4ade80; background: rgba(74,222,128,0.08); }
        .log-error { border-left-color: #f87171; background: rgba(248,113,113,0.08); }
        .log-command { border-left-color: #a855f7; background: rgba(168,85,247,0.08); }
        .log-info { border-left-color: #667eea; background: rgba(102,126,234,0.08); }
        .log-time { color: #64748b; margin-right: 12px; font-size: 10px; }
        .empty-state { text-align: center; padding: 50px; color: #64748b; }
        @media (max-width: 1100px) { .dashboard { grid-template-columns: 1fr; } .right-panel { position: static; margin-top: 24px; } .console-output { height: 380px; } }
        @media (max-width: 640px) { .container { padding: 16px; } .title { font-size: 32px; } .stats-grid { grid-template-columns: 1fr; } .ctrl-btn { padding: 8px 20px; font-size: 13px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title"><span class="red">Iftekhar</span><span class="blue"> Hosting</span></div>
            <div class="subtitle">Server Control Panel • Real-time Console • File Manager</div>
        </div>
        <div class="dashboard">
            <div class="left-panel">
                <div class="status-card"><div id="serverStatus"><i class="fas fa-circle"></i> <span id="statusText">stopped</span></div></div>
                <div class="server-controls">
                    <button class="ctrl-btn btn-start" id="startBtn"><i class="fas fa-play"></i> START</button>
                    <button class="ctrl-btn btn-stop" id="stopBtn"><i class="fas fa-stop"></i> STOP</button>
                    <button class="ctrl-btn btn-restart" id="restartBtn"><i class="fas fa-sync-alt"></i> RESTART</button>
                </div>
                <div class="stats-grid">
                    <div class="stat-card"><i class="fas fa-cloud-upload-alt"></i><div class="stat-value" id="totalFiles">0</div><div>Total Files</div></div>
                    <div class="stat-card"><i class="fas fa-database"></i><div class="stat-value" id="totalSize">0 MB</div><div>Storage Used</div></div>
                    <div class="stat-card"><i class="fas fa-star"></i><div class="stat-value" id="mainStatus">✗</div><div>Main File</div></div>
                </div>
                <div class="dropzone" id="dropzone">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p><strong>Drag & Drop</strong> or click to upload</p>
                    <small>ZIP files auto-extract • Max 100MB</small>
                    <input type="file" id="fileInput" style="display: none;" multiple>
                </div>
                <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="files-header"><h4><i class="fas fa-th-large"></i> Your Files</h4><button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button></div>
                <div class="files-grid" id="filesGrid"><div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading...</div></div>
            </div>
            <div class="right-panel">
                <div class="console-header">
                    <div class="console-title"><i class="fas fa-terminal"></i> Real-time Console Log</div>
                    <div class="console-actions">
                        <button class="console-btn" id="clearConsole"><i class="fas fa-eraser"></i> Clear</button>
                        <button class="console-btn" id="autoScrollBtn" style="background:rgba(102,126,234,0.3)"><i class="fas fa-arrow-down"></i> Auto</button>
                    </div>
                </div>
                <div class="console-output" id="consoleOutput"><div class="empty-state"><i class="fas fa-terminal"></i><p>Console output will appear here</p></div></div>
            </div>
        </div>
    </div>
    <script>
        let filesDB = JSON.parse(localStorage.getItem('iftekhar_files') || '{}');
        let serverRunning = false;
        let autoScroll = true;
        let outputPolling = null;
        
        const consoleOutput = document.getElementById('consoleOutput');
        
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        
        function addLog(message, type) {
            const logDiv = document.createElement('div');
            logDiv.className = `log-line log-${type}`;
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            let icon = type === 'output' ? '📤 ' : type === 'error' ? '❌ ' : type === 'command' ? '⚡ ' : '📌 ';
            logDiv.innerHTML = `<span class="log-time">[${timeStr}]</span> ${icon}${escapeHtml(message)}`;
            consoleOutput.appendChild(logDiv);
            if (autoScroll) logDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            while (consoleOutput.children.length > 500) consoleOutput.removeChild(consoleOutput.firstChild);
        }
        
        document.getElementById('clearConsole').onclick = () => { consoleOutput.innerHTML = '<div class="empty-state"><i class="fas fa-terminal"></i><p>Console cleared</p></div>'; addLog('Console cleared', 'info'); };
        document.getElementById('autoScrollBtn').onclick = () => { autoScroll = !autoScroll; document.getElementById('autoScrollBtn').style.background = autoScroll ? 'rgba(102,126,234,0.3)' : 'rgba(255,255,255,0.05)'; addLog(`Auto-scroll ${autoScroll ? 'enabled' : 'disabled'}`, 'info'); };
        
        function startOutputPolling() {
            if (outputPolling) clearInterval(outputPolling);
            outputPolling = setInterval(async () => {
                try {
                    const res = await fetch('/api/script/output');
                    const data = await res.json();
                    if (data.outputs && data.outputs.length) {
                        for (const out of data.outputs) addLog(out.message, out.type);
                    }
                } catch(e) {}
            }, 500);
        }
        
        async function updateScriptStatus() {
            try {
                const res = await fetch('/api/script/status');
                const data = await res.json();
                const statusText = document.getElementById('statusText');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');
                const restartBtn = document.getElementById('restartBtn');
                if (data.running) {
                    statusText.innerHTML = '<span class="status-running">● RUNNING</span>';
                    startBtn.disabled = true; stopBtn.disabled = false; restartBtn.disabled = false;
                } else {
                    statusText.innerHTML = '<span class="status-stopped">● STOPPED</span>';
                    startBtn.disabled = false; stopBtn.disabled = true; restartBtn.disabled = false;
                }
            } catch(e) {}
        }
        
        document.getElementById('startBtn').onclick = async () => { await fetch('/api/script/start', { method: 'POST' }); updateScriptStatus(); };
        document.getElementById('stopBtn').onclick = async () => { await fetch('/api/script/stop', { method: 'POST' }); updateScriptStatus(); };
        document.getElementById('restartBtn').onclick = async () => { await fetch('/api/script/restart', { method: 'POST' }); updateScriptStatus(); };
        
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        dropzone.onclick = () => fileInput.click();
        dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('drag-over'); };
        dropzone.ondragleave = () => dropzone.classList.remove('drag-over');
        dropzone.ondrop = e => { e.preventDefault(); dropzone.classList.remove('drag-over'); handleFiles(Array.from(e.dataTransfer.files)); };
        fileInput.onchange = e => handleFiles(Array.from(e.target.files));
        document.getElementById('refreshBtn').onclick = () => loadFiles();
        
        async function handleFiles(files) { for (const file of files) await uploadFile(file); loadFiles(); }
        
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            const progress = document.getElementById('progressBar');
            const fill = document.getElementById('progressFill');
            progress.style.display = 'block';
            fill.style.width = '50%';
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                fill.style.width = data.success ? '100%' : '0%';
                setTimeout(() => { progress.style.display = 'none'; fill.style.width = '0%'; }, 1000);
            } catch { fill.style.width = '0%'; }
        }
        
        async function loadFiles() {
            try {
                const res = await fetch('/api/files');
                const data = await res.json();
                if (data.success) {
                    document.getElementById('totalFiles').innerText = data.total_files;
                    document.getElementById('totalSize').innerText = data.total_size_mb;
                    document.getElementById('mainStatus').innerHTML = data.has_main ? '✓' : '✗';
                    renderFiles(data.files);
                }
            } catch(e) {}
        }
        
        function renderFiles(files) {
            const grid = document.getElementById('filesGrid');
            if (!files.length) { grid.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No files uploaded</p></div>'; return; }
            grid.innerHTML = files.map(f => `
                <div class="file-card">
                    ${f.is_main ? '<div class="main-badge"><i class="fas fa-star"></i> MAIN</div>' : ''}
                    <div class="file-icon"><i class="${f.icon}" style="color: ${f.color}"></i></div>
                    <div class="file-name">${f.name.length > 30 ? f.name.substring(0,30)+'...' : f.name}</div>
                    <div class="file-meta">${f.size_mb} MB • ${f.date}</div>
                    <div class="file-actions">
                        ${f.is_python ? `<button class="action-btn set-main" data-id="${f.id}"><i class="fas fa-star"></i> Main</button>` : ''}
                        <button class="action-btn download" data-id="${f.id}"><i class="fas fa-download"></i> Download</button>
                        <button class="action-btn delete" data-id="${f.id}"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                    ${f.has_extracted ? `<div style="margin-top:8px; font-size:10px; color:#4ade80;"><i class="fas fa-check-circle"></i> ${f.extracted_count} files extracted</div>` : ''}
                </div>
            `).join('');
            document.querySelectorAll('.set-main').forEach(btn => btn.onclick = async () => { await fetch(`/api/set-main/${btn.dataset.id}`, { method: 'POST' }); loadFiles(); });
            document.querySelectorAll('.download').forEach(btn => btn.onclick = () => window.location.href = `/api/download/${btn.dataset.id}`);
            document.querySelectorAll('.delete').forEach(btn => btn.onclick = async () => { if (confirm('Delete this file?')) { await fetch(`/api/delete/${btn.dataset.id}`, { method: 'DELETE' }); loadFiles(); } });
        }
        
        startOutputPolling();
        updateScriptStatus();
        loadFiles();
        setInterval(updateScriptStatus, 3000);
    </script>
</body>
  </html>
